name: daily (A腿 + T腿)
on:
  schedule:
    - cron: '10 0 * * *'     # UTC 00:10 (日K收好後)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # ★快取pip packages: 省40-60秒/次 = 每月省~700分鐘額度
      - run: pip install -r requirements.txt
      - name: Run daily cycle
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python run.py daily
      - name: Commit state
        run: |
          git config user.name "forward-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ || true
          git diff --staged --quiet || git commit -m "daily $(date -u +%Y-%m-%d)"
          git push || true
