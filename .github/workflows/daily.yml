name: daily (A腿 + T腿)
on:
  schedule:
    # ★2026-11-03: UTC 00:10 → 00:37。整點前後是GitHub排程尖峰, 官方建議避開。
    #   實測排在00:10時, A/T腿實際換倉平均晚 5.0h(最晚6.6h), 且9月以來從3.9h持續惡化。
    #   日K在00:00收好, 00:37仍在收盤後 → 訊號完全一樣(A/T腿看日K, 一天只變一次)。
    #   實測延遲成本: 30次換倉累計對總資金 +0.49%(延遲反而小賺), 17天幫倒忙/13天賺到 = 雜訊。
    #   所以這是「順便修」, 不是救命。只改執行時間, 不動策略參數。
    - cron: '37 0 * * *'     # UTC 00:37 (日K收好後, 避開整點尖峰)
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # ★快取pip packages: 省40-60秒/次 = 每月省~700分鐘額度
      - run: pip install -r requirements.txt
      - name: Run daily cycle
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BINANCE_DEMO_KEY: ${{ secrets.BINANCE_DEMO_KEY }}
          BINANCE_DEMO_SECRET: ${{ secrets.BINANCE_DEMO_SECRET }}
        run: python run.py daily
      - name: Commit state
        if: always()
        run: |
          git config user.name "forward-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ state_testnet/ || true
          git diff --staged --quiet || git commit -m "daily $(date -u +%Y-%m-%d)"
          git push || true
