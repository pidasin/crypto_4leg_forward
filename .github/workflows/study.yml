name: study (一次性研究, 手動觸發)
# ★只有 workflow_dispatch, 沒有 schedule → 不消耗任何自動額度。
#   用途: 需要大量歷史資料的一次性分析。放在 Actions 跑而非本機的理由不只是方便 ——
#   本機對 api.exchange.coinbase.com 的連線被不受信任的憑證攔截(連 Windows 信任庫都驗不過),
#   用來源可疑的資料去裁決一條腿的生死, 比沒有資料更糟。
on:
  workflow_dispatch:
    inputs:
      script:
        description: "要執行的 tools/ 腳本"
        required: true
        default: "std_regime_study.py"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run study
        run: python tools/${{ inputs.script }}
      - name: Commit results
        if: always()
        run: |
          git config user.name "forward-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "study: $(date -u +%Y-%m-%dT%H:%M)"
          git push || (git pull --rebase && git push)
