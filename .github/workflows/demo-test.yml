name: demo-test (連線測試, 手動觸發)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests
      - name: 端點探測 (哪些幣安服務擋美國IP?)
        run: |
          for u in \
            "https://data-api.binance.vision/api/v3/ping" \
            "https://api.binance.com/api/v3/ping" \
            "https://demo-api.binance.com/api/v3/ping" \
            "https://testnet.binance.vision/api/v3/ping" \
            "https://testnet.binancefuture.com/fapi/v1/ping" ; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 12 "$u")
            echo "$code  $u"
          done
      - name: Demo Trading 連線測試
        env:
          BINANCE_DEMO_KEY: ${{ secrets.BINANCE_DEMO_KEY }}
          BINANCE_DEMO_SECRET: ${{ secrets.BINANCE_DEMO_SECRET }}
        run: python tools/demo_check.py
