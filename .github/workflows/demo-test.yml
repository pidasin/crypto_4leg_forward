name: demo-test (連線測試, 手動觸發)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install requests
      - name: Demo Trading 連線測試
        env:
          BINANCE_DEMO_KEY: ${{ secrets.BINANCE_DEMO_KEY }}
          BINANCE_DEMO_SECRET: ${{ secrets.BINANCE_DEMO_SECRET }}
        run: python tools/demo_check.py
