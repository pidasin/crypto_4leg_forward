name: hourly (溢價腿 + DVOL腿)
on:
  schedule:
    # ★實測(2026-07-19): GitHub免費cron到達率只有~60%, 48h內只跑29次, 最長斷3.7h。
    #   排程事件是best-effort, 高峰期會被丟掉 —— 不是故障, 是平台特性。
    #   對策: 每20分鐘排一次。訊號本身仍是小時級(K棒沒收完算出來一樣),
    #   多跑的那幾次幾乎都是no-op(部位沒變就不下單), 但能把「整點覆蓋率」拉到接近100%。
    #   repo已轉公開 → Actions分鐘數無限, 頻率提高零成本。
    - cron: '5,25,45 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # ★快取pip packages: 省40-60秒/次 = 每月省~700分鐘額度
      - run: pip install -r requirements.txt
      - name: Run hourly cycle
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BINANCE_DEMO_KEY: ${{ secrets.BINANCE_DEMO_KEY }}
          BINANCE_DEMO_SECRET: ${{ secrets.BINANCE_DEMO_SECRET }}
        run: python run.py hourly
      - name: Build dashboard
        if: always()
        run: python tools/build_dashboard.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "forward-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ state_testnet/ docs/ || true
          git diff --staged --quiet || git commit -m "hourly $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
