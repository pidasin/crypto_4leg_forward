name: hourly (溢價腿 + DVOL腿)
on:
  schedule:
    # ★實測結論(2026-07-20): GitHub排程到達率無法用「排更密」解決。
    #   7/19改成每20分鐘(每天應72次)後實測: 每小時覆蓋率 54%→58% (雜訊範圍),
    #   絕對次數 13次/天 → 16次/天 —— GitHub就是給你約15次/天, 排再多也一樣被丟。
    #   已改回每小時。真正的緩解不是排程, 是系統本身:
    #     (1) 每次執行都從完整歷史重算, 不是增量 → 漏掉的小時自動補回, 不留疤
    #     (2) 判決層已改為先彙總成【日報酬】再年化 → 對不規則間隔免疫
    #
    # ⚠️ 上面第(3)點原本寫「實測最長斷點3.9h → 成本≈0」—— 2026-11-03 已過時, 作廢:
    #   到達率持續下滑且沒有恢復: 7-8月 ~15次/天(平均間隔1.5h) → 10月 ~5次/天 → 11月初 ~4.3次/天,
    #   間隔>4h的比例從 2% 升到 34%, 最長斷點 10.5h。每次觸發都成功, 是GitHub沒觸發。
    #   量化成本(用2023-2026真實小時資料, 照實際間隔分佈bootstrap 200次):
    #     7-8月頻率 → 溢價腿Sharpe 1.54→1.52, DVOL 1.29→1.26, 對總資金 -0.39%/年
    #     9月後頻率 → 溢價腿 1.54→1.50, DVOL 1.29→1.22, 對總資金 -0.86%/年
    #   還在可接受範圍, 但不再是「≈0」。
    # ★2026-11-03 實驗: 分鐘從 :05 改成 :41。
    #   理由: 整點前後是GitHub排程的尖峰, 官方文件明確建議避開。這只改【執行時間】,
    #   不動任何策略參數 → 不觸發 config.py 的「重置判決時鐘」條款。
    #   驗收: 跑一週後看每天觸發次數有沒有從 ~4.3 回升。沒回升就是GitHub整體降級, 與分鐘無關。
    - cron: '41 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # ★快取pip packages: 省40-60秒/次 = 每月省~700分鐘額度
      - run: pip install -r requirements.txt
      - name: Run hourly cycle
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BINANCE_DEMO_KEY: ${{ secrets.BINANCE_DEMO_KEY }}
          BINANCE_DEMO_SECRET: ${{ secrets.BINANCE_DEMO_SECRET }}
        run: python run.py hourly
      - name: Build dashboard
        if: always()
        run: |
          python tools/build_dashboard.py
          python tools/build_odds.py
          python tools/build_history.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "forward-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ state_testnet/ docs/ || true
          git diff --staged --quiet || git commit -m "hourly $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
