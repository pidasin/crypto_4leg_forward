name: hourly (溢價腿 + DVOL腿)
on:
  schedule:
    # ★實測結論(2026-07-20): GitHub排程到達率無法用「排更密」解決。
    #   7/19改成每20分鐘(每天應72次)後實測: 每小時覆蓋率 54%→58% (雜訊範圍),
    #   絕對次數 13次/天 → 16次/天 —— GitHub就是給你約15次/天, 排再多也一樣被丟。
    #   已改回每小時。真正的緩解不是排程, 是系統本身:
    #     (1) 每次執行都從完整歷史重算, 不是增量 → 漏掉的小時自動補回, 不留疤
    #     (2) 判決層已改為先彙總成【日報酬】再年化 → 對不規則間隔免疫
    #     (3) 時間破壞測試: 延遲6h只掉0.04 Sharpe, 而實測最長斷點3.9h → 成本≈0
    - cron: '5 * * * *'
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # ★快取pip packages: 省40-60秒/次 = 每月省~700分鐘額度
      - run: pip install -r requirements.txt
      - name: Run hourly cycle
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BINANCE_DEMO_KEY: ${{ secrets.BINANCE_DEMO_KEY }}
          BINANCE_DEMO_SECRET: ${{ secrets.BINANCE_DEMO_SECRET }}
        run: python run.py hourly
      - name: Build dashboard
        if: always()
        run: |
          python tools/build_dashboard.py
          python tools/build_odds.py
          python tools/build_history.py
      - name: Commit state
        if: always()
        run: |
          git config user.name "forward-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ state_testnet/ docs/ || true
          git diff --staged --quiet || git commit -m "hourly $(date -u +%Y-%m-%dT%H:%M)"
          git push || true
