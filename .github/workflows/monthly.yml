name: monthly (第二層) + judge (第三層)
on:
  schedule:
    - cron: '30 0 1 * *'     # 每月1號 UTC 00:30
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'          # ★快取pip packages: 省40-60秒/次 = 每月省~700分鐘額度
      - run: pip install -r requirements.txt
      - name: Layer2 + Layer3
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          python run.py monthly
          python run.py judge
      - name: Commit state
        run: |
          git config user.name "forward-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/ || true
          git diff --staged --quiet || git commit -m "monthly $(date -u +%Y-%m)"
          git push || true
